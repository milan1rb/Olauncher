name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: olauncher-v2-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK to a release (direct download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v2.0-dev --yes --cleanup-tag || true
          gh release create v2.0-dev app/build/outputs/apk/debug/*.apk \
            --title "Olauncher V2 (build de test)" \
            --notes "APK genere automatiquement depuis le commit ${GITHUB_SHA}."
